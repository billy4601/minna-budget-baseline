title: 受委託辦理訓練計畫，講座由受委託機關內部人員擔任之鐘點費
type: 函釋
issuer: 原行政院人事行政局
document_no: 局給字第009403號
date: 1998-05-11
applies_to_version: 2018-02-01                 # 函中金額已依現行支給表換算
validity: 現行
source:
