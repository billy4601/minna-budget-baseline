key_points:
  - 機關學校受託依原主辦機關之計畫及經費辦理訓練，講座由受託單位內部人員擔任者，依外聘講座標準支給（現為每節 2000 元；有隸屬關係者 1500 元）。
  - 委託訓練之原主辦機關人員前往授課者，依內聘標準支給（現為每節 1000 元）。
note: 受託辦理訓練、講習之計畫編列鐘點費時適用。
