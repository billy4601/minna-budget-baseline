key_points:
  - 依政府採購法辦理者，經費依個案特性編列，不受本要點經費編列基準限制。
  - 補助計畫不補助加班費；執行單位可由年度經費支付，配合政策需要者可列於自籌款。
  - 特別休假未休工資不得預先編列；已發生者由自籌收入支應。
  - 專任助理 12 月 1 日仍在職者，年終獎金可合併任職前政府機構年資計算。
  - 大專專任助理最多兼任二項計畫，每月兼任報酬合計以 1 萬元為限；研究生依校內兼職規定。
  - 有勞務對價且具從屬關係之獎助生，依性質編列兼任助理或工讀費；無對價者編列獎助金。
  - 補助計畫之執行單位人員，除實際授課外，不得支領出席費、稿費、審查費、工作費等酬勞。
  - 大專校院研究性質計畫之彈性經費，為核定總額 2%、上限 25000 元。
  - 行政管理費、內部場地使用費原則不補助。
note: 彙編各則未載函號；部分內容可能已因 115-01-01 生效之基準表修正而變動，引用前應核對。
