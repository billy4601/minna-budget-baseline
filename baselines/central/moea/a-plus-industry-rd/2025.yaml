  - category: 創新或研究發展人員之人事費
    item: 待聘人員
    unit: 研發人員及國際人才合計之比率
    max: 0.30
    note: 原則
  - category: 創新或研究發展人員之人事費
    item: 年終獎金
    unit: 月
    max: 2
