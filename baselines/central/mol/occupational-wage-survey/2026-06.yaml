notes:
  - 調查範圍為工業及服務業（不含公共行政業）之全時受僱員工，全國不含金門、連江。
  - 數值取自表 3「全時受僱員工人數、薪資—按職類分」（全體工業及服務業），只收錄編列計畫人事費常用之職類及各大類。
  - 經常性薪資：114 年 7 月全月工作報酬，含本薪、按月給付之固定津貼及獎金，不扣除所得稅、保險費及工會會費。
  - 薪資所得：113 年全年在職者扣繳憑單之給付總額，加計依法提（撥）繳之退休金（不計入薪資課稅者）。
  - 各行業別數值見表 4 至表 20（例：出版影音及資通訊業為表 12、專業科學及技術服務業為表 15），需要時再查原檔或「職類別薪資調查動態查詢」https://pswst.mol.gov.tw/psdn/。
  - 原檔 27 MB，以統計表為主，不另存全文 Markdown。
