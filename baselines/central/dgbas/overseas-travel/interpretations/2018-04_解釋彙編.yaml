title: 國外出差旅費報支要點解釋彙編（103 年 1 月編訂，107 年 4 月修編）
type: 解釋彙編
issuer: 行政院主計總處
document_no:
date: 2018-04
applies_to_version: 2017-11-01
validity: 部分適用
source:
  url: https://acc.nccu.edu.tw/sites/default/files/travel10704.pdf
  type: repost
  retrieved: 2026-11-17
status: 確認                                   # 2026-11-17 查無 115 年新版之後的修編版
key_points:
  - 生活費日支數額概以 70% 住宿費、20% 膳食費、10% 零用費劃分。
  - 禮品交際及雜費按規定數額檢據報支，未限制致贈對象，亦未要求附受贈人名冊；機關另訂內部規範者從其規範。
note: 115-01-01 生效之修正已調整禮品交際費額度（非率團人員每人每日 1100 元）、刪除登機證證明、改依當地時間計算日期等，彙編中相關解釋以新規定為準。
