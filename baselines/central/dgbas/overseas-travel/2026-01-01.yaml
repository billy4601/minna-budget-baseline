notes:
  - 本檔只摘錄常用城市；其他國家城市查日支數額表原文。表列國家未列之城市按該國「其他」；未列國家比照最近國家之「其他」。
  - 大陸地區、香港及澳門另依其日支數額表（待收錄）。
  - 匯率：有結匯水單依結匯匯率；無則依出差日前一日臺灣銀行賣出現金美元匯價；信用卡支付得依信用卡結算匯率。
