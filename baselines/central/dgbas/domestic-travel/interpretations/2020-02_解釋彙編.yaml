title: 國內出差旅費報支要點暨各機關派員參加國內各項訓練或講習費用補助要點解釋彙編（109 年 2 月修編）
type: 解釋彙編
issuer: 行政院主計總處
document_no:
date: 2020-02
applies_to_version: 2020-01-01                # 編於 109-01-01 生效版之後；114-01-01 新版已再修正
validity: 部分適用
source:
  url: https://www.dgbas.gov.tw/public/Data/0729175133J2042CJ5.pdf
  type: official
  retrieved: 2026-11-17
status: 確認                                   # 2026-11-17 查無較新之修編版
key_points:
  - 交通費依實際搭乘之交通工具及實際支付金額報支（例：高鐵早鳥票、自由座以實付優惠票價報支）。
  - 因公搭乘高鐵之優惠措施，應以優惠後票價報支，或將優惠差價回饋抵減差旅費。
note: 本彙編中依職等區分住宿費、駕駛自用汽機車按客運票價報支等解釋，已因 114-01-01 生效之修正（住宿費不分職等、自用汽車每公里 3 元、機車 2 元）不再適用。另有「國內出差交通費報支相關事項問答集」（109 年 1 月編訂），待收錄。
