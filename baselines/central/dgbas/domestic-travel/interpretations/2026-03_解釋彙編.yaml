  sha256: 0bee57a65340baa33d57e3ad859ee5a142b9780f6968b150c00095a9f2e90e7b
status: 確認
key_points:
  - 交通費依實際搭乘之交通工具及實際支付金額報支（例：高鐵早鳥票、自由座以實付優惠票價報支）。
  - 雜費維持每日上限 400 元，自 103 年未調整（主計總處 113-12-30 主預字第1130103673號函「修正國內出差旅費報支要點問答集」Q13）。
  - 機關只核出差當日差假者，提早一日出發之住宿費，應視奉准差假期間判斷（主計總處 113-05-14 主會財字第1131500357號函）。
  - 出差搭乘比照市區公車里程收費之幸福巴士，交通費之報支方式（主計總處 115-01-20 主預字第1150100136號函）。
  - 奉派跨機關兼辦業務得否報支交通費及雜費（主計總處 112-11-21 主預政字第1120055482號主計長信箱）。
note: 本版標「☉」之新增案例 4 則、標「◎」之修正條文 35 處；後續新增釋例由主計總處逕更新於網站。
