title: 國內出差旅費報支要點暨各機關派員參加國內各項訓練或講習費用補助要點解釋彙編（115 年 3 月修編）
type: 解釋彙編
issuer: 行政院主計總處
document_no:
date: 2026-03
applies_to_version: 2025-01-01
validity: 現行
supersedes: 2020-02_解釋彙編
source:
  url: https://www.dgbas.gov.tw/News_Content.aspx?n=1522&s=235980
  type: official                               # 主計總處「主要業務／政府預算／解釋彙編」
  retrieved: 2026-11-17
