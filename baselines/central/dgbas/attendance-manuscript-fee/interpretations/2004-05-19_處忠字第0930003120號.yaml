key_points:
  - 謄稿沒有智慧財產之創作，不宜以撰稿名義支給稿費；於辦公時間外趕辦者，得依規定支給加班費。
note: 轉引自臺北榮民總醫院會計室之稿費法令彙整（政府機關轉載）；主計總處網站未見原函。該彙整已引用 111 年修正之「中央政府各機關學校出席費及稿費支給要點」第 7 點，仍列本函，且本函意旨與現行要點第 8 點第 1 款（機關人員處理本機關業務文件不得支給稿費）一致，故推論仍適用；未見主計總處明文廢止或確認。
