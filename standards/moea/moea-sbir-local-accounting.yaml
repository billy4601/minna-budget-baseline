id: moea-sbir-local-accounting
title: 地方產業創新研發推動計畫（地方型 SBIR）會計科目及編列原則
issuer: 各直轄市、縣（市）政府（依經濟部中小及新創企業署作業須知）
document_no:
version_date: 2026                 # 高雄市 115 年度版
applies_to: [地方型 SBIR]
source:
  url: https://orgws.kcg.gov.tw/001/KcgOrgUploadFiles/490/RelFile/80518/523868/04eaf90f-c5a7-45c9-abbd-4028d88bc213.pdf
  type: official
  retrieved: 2026-11-17
status: 確認
items:
  - category: 研究發展人員人事費
    item: 人員資格
    note: 以公司正式員工為限，不得編列會計、財務等非研發人員；計畫主持人應列入
  - category: 研究發展人員人事費
    item: 可核銷項目
    note: 只得核銷本薪、職務加給（或技術津貼）與主管加給
  - category: 材料費
    item: 消耗性器材及原材料費
    unit: 元/人年
    max: 150000
    note: 彰化縣版；超過應補充說明（https://files.chcg.gov.tw/files/47_20250224101012048_附件D_會計科目及編列原則.pdf）
notes:
  - 各縣市版本內容大致相同，但仍以申請縣市當年度公告為準。
  - 自籌款須不少於政府補助款（彰化縣版）。
  - 中央型 SBIR、跨域型之會計科目待收錄（見 BACKLOG.md）。
